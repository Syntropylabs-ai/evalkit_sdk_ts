name: Publish TypeScript SDK

# Publishes the EvalKit TypeScript SDK to npm.
#
# Triggers:
#   - Manually from the Actions tab ("Run workflow").
#   - Automatically when a tag like v0.1.0 is pushed.
#
# Setup (one-time):
#   1. Create an npm "Automation" access token with publish rights for the
#      `syntropylabs-evalkit` package (npmjs.com -> Access Tokens).
#   2. In this repo: Settings -> Environments -> create environment `prod`.
#   3. Add the token as an environment secret named `NPM_TOKEN` under `prod`.
#
# Release flow:
#   - Bump "version" in package.json and SDK_VERSION in src/core/client.ts, add a
#     CHANGELOG entry, commit, then:
#       git tag v0.1.18 && git push origin v0.1.18

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Note: provenance is intentionally disabled — npm only supports it for PUBLIC
  # source repos, and evalkit_sdk_ts is private. If this repo is ever made public,
  # add `id-token: write` here and `NPM_CONFIG_PROVENANCE: "true"` to the publish
  # step to enable signed provenance.

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    environment: prod        # must hold the NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm never accepts the same version twice, so a run without a version bump would
      # fail only at the upload, after the whole build. This fails first and says what to change.
      - name: Check the version
        run: |
          version=$(node -p "require('./package.json').version")
          if ! grep -q "const SDK_VERSION = \"$version\";" src/core/client.ts; then
            echo "::error file=src/core/client.ts::SDK_VERSION in src/core/client.ts must match package.json ($version). Spans report it as the SDK version."
            exit 1
          fi
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/syntropylabs-evalkit/$version")" = 200 ]; then
            echo "::error file=package.json::syntropylabs-evalkit@$version is already on npm, and npm never accepts a version twice. Bump \"version\" in package.json and SDK_VERSION in src/core/client.ts, add a CHANGELOG entry, commit and run this again."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build & minify
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
